name: Build APK & iOS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ---------- Android APK（universal + arm64） ----------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Release APK (universal)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-universal-release.apk

      - name: Build arm64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-arm64-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-apk
          path: |
            /tmp/app-universal-release.apk
            /tmp/app-arm64-release.apk
          retention-days: 30

      - name: Compute version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          # 展示归一：pubspec 为规范三段式，对外呈现去掉尾缀 .0（1.0.0 -> 1.0）
          DISPLAY="${VERSION%.0}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${DISPLAY}-beta"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$DISPLAY" >> $GITHUB_OUTPUT

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }} ${{ github.ref_type == 'tag' && '' || '-beta' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            /tmp/app-universal-release.apk
            /tmp/app-arm64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- iOS IPA（未签名，供设备侧自签/ sideload 安装） ----------
  ios:
    name: Build iOS IPA
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -qry /tmp/legado-ios-unsigned.ipa Payload
          ls -la /tmp/legado-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios
          path: /tmp/legado-ios-unsigned.ipa
          retention-days: 30

      - name: Compute version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          DISPLAY="${VERSION%.0}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${DISPLAY}-beta"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$DISPLAY" >> $GITHUB_OUTPUT

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }} ${{ github.ref_type == 'tag' && '' || '-beta' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: /tmp/legado-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
