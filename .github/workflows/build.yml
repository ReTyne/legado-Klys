name: Build APK & iOS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ---------- Android APK（universal + arm64） ----------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # 欢迎页图标来自运行时 IconData 码点（配置驱动），无法静态 tree-shake；
      # 不加 --no-tree-shake-icons 会在 icon tree shaking 阶段直接构建失败。
      - name: Build Release APK (universal)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-universal-release.apk

      - name: Build arm64 APK
        run: |
          flutter build apk --release --no-tree-shake-icons --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-arm64-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-apk
          path: |
            /tmp/app-universal-release.apk
            /tmp/app-arm64-release.apk
          retention-days: 30

      - name: Compute version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          # tag 发布用完整三段式（1.1.0）；beta 标签去掉尾缀 .0（v1.1-beta）
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION%.0}-beta"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}${{ github.ref_type != 'tag' && ' -beta' || '' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          body: |
            界面与 legado-E 全面对齐（书架重构 / 发现 / 订阅 / 我的）。
            iOS 为未签名 IPA，需自行签名或 sideload 后安装。
            详见 CHANGELOG.md。
          files: |
            /tmp/app-universal-release.apk
            /tmp/app-arm64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- iOS IPA（未签名，供设备侧自签/ sideload 安装） ----------
  ios:
    name: Build iOS IPA
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package unsigned IPA
        run: |
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -qry /tmp/legado-ios-unsigned.ipa Payload
          ls -la /tmp/legado-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios
          path: /tmp/legado-ios-unsigned.ipa
          retention-days: 30

      - name: Compute version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          # tag 发布用完整三段式（1.1.0）；beta 标签去掉尾缀 .0（v1.1-beta）
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION%.0}-beta"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}${{ github.ref_type != 'tag' && ' -beta' || '' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          body: |
            界面与 legado-E 全面对齐（书架重构 / 发现 / 订阅 / 我的）。
            iOS 为未签名 IPA，需自行签名或 sideload 后安装。
            详见 CHANGELOG.md。
          files: /tmp/legado-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
