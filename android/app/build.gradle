plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.legado.md3"
    compileSdk 36
    // 对齐 AGP/插件(sqflite_android/url_launcher/video_player)要求的 NDK 27，
    // 消除 "requires Android NDK 27.0.12077973" 探测告警（预编译插件向后兼容）。
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.legado.md3"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }
}

dependencies {
    // 媒体通知栏样式（NotificationCompat.MediaStyle），minSdk 19
    implementation "androidx.media:media:1.7.0"
    // 7z 解压
    implementation "org.apache.commons:commons-compress:1.26.0"
    // rar 解压
    implementation "com.github.junrar:junrar:7.5.5"
}

flutter {
    source '../..'
}
