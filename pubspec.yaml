name: legado_md3
description: Legado with MD3 - 跨平台开源阅读器
publish_to: 'none'
version: 3.30.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  dio: ^5.4.3+1
  html: ^0.15.4
  csslib: ^1.0.0
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  scrollable_positioned_list: ^0.3.8
  flutter_tts: 4.0.2
  file_picker: ^8.0.3
  epubx: ^4.0.0-dev.2
  archive: ^3.4.10
  permission_handler: ^11.3.1
  intl: ^0.19.0
  crypto: ^3.0.3
  convert: ^3.1.1
  package_info_plus: ^8.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  flutter_inappwebview: ^6.0.0
  collection: ^1.18.0
  tuple: ^2.0.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  audioplayers: ^5.2.1
  mobile_scanner: ^3.5.5
  enough_convert: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/web/
    - assets/web/css/
    - assets/web/js/
    - assets/web/fonts/
    - assets/web/img/
    - assets/web/img/icons/
